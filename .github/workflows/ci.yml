name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend · ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - eureka-server
          - config-server
          - gateway-service
          - identity-service
          - notification-service
          - care-team-service
    defaults:
      run:
        working-directory: backend/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/${{ matrix.service }}/pom.xml

      # Unit, web-layer and Testcontainers-based tests (Docker is available on ubuntu runners)
      - name: Build and test
        run: mvn -B -ntp verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-${{ matrix.service }}
          path: backend/${{ matrix.service }}/target/surefire-reports
          retention-days: 7

  ml-prediction:
    name: ML service · train + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/ml-prediction-service
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/ml-prediction-service/requirements*.txt

      - run: pip install -r requirements-dev.txt

      # Trains and evaluates the model exactly as the Docker build does
      - name: Train model
        run: python -m training.train

      - name: Run tests
        run: pytest

      - name: Build Docker image
        run: docker build -t alzcare/ml-prediction:ci .

  frontend:
    name: Frontend · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci --no-audit --no-fund

      - name: Production build
        run: npx ng build --configuration production
