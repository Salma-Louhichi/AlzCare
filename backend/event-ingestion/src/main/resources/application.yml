# =============================================================================
# Default Profile - Bootstrap Configuration Only
# All actual configuration comes from Config Server (config-repo/event-ingestion.yml)
# =============================================================================

server:
  port: 8002

spring:
  application:
    name: event-ingestion
  config:
    import: "optional:configserver:http://localhost:8888"

---
# Docker profile
spring:
  config:
    activate:
      on-profile: docker
    import: "optional:configserver:http://config-server:8888"
