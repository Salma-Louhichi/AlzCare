# Notification Service Configuration

server:
  port: 8004

spring:
  data:
    mongodb:
      uri: mongodb://${MONGO_HOST:localhost}:${MONGO_PORT:27017}/${MONGO_DATABASE:notifications}
      database: ${MONGO_DATABASE:notifications}
      connection-timeout: 5000
      socket-timeout: 5000
      server-selection-timeout: 5000

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: /
    connection-timeout: 5000

# Logging
logging:
  level:
    root: INFO
    com.alzcare.notification: DEBUG
    org.springframework.web: INFO
    org.springframework.data.mongodb: INFO
    org.springframework.amqp: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# Management / Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
    info:
      enabled: true
  info:
    env:
      enabled: true

# Notification Scheduler Configuration
notification:
  scheduler:
    enabled: true
    reload-on-startup: true
  schedule:
    mood-check: "0 0 9 * * *"           # DEPRECATED: Use dynamic scheduler
    hydration: "0 0 9,13,17,21 * * *"   # DEPRECATED: Use dynamic scheduler
    brain-training: "0 0 14 * * *"      # DEPRECATED: Use dynamic scheduler

# Services Configuration
services:
  identity:
    url: http://identity-service

# OpenAPI / Swagger
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
  info:
    title: Notification Service API
    description: Notification management service for AlzCare platform
    version: 1.0.0

# Eureka Client Configuration
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    hostname: notification-service

---
# Docker Profile
spring:
  config:
    activate:
      on-profile: docker
  data:
    mongodb:
      uri: mongodb://mongo-notification:27017/notifications
      database: notifications
  rabbitmq:
    host: rabbitmq
    port: 5672
    username: ${RABBITMQ_USERNAME:alzcare}
    password: ${RABBITMQ_PASSWORD:alzcare123}

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    hostname: notification-service

---
# Development Profile
spring:
  config:
    activate:
      on-profile: dev
  data:
    mongodb:
      uri: mongodb://localhost:27017/notification_db
      database: notification_db
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
