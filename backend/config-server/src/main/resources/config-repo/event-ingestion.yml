# =============================================================================
# Event Ingestion Service - ESP32 home cameras, motion events, pattern detection
# =============================================================================

server:
  port: 8002

spring:
  application:
    name: event-ingestion
  datasource:
    url: jdbc:postgresql://localhost:5434/postgres-event
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate          # schema owned by Flyway (db/migration)
    open-in-view: false
  flyway:
    enabled: true
  rabbitmq:
    host: localhost
    port: 5672
    username: ${RABBITMQ_USERNAME:alzcare}
    password: ${RABBITMQ_PASSWORD:alzcare123}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8090/realms/alzcare
          jwk-set-uri: http://localhost:8090/realms/alzcare/protocol/openid-connect/certs
      client:
        registration:
          event-ingestion:
            provider: keycloak
            client-id: alzcare-event-ingestion
            client-secret: ${EVENT_INGESTION_CLIENT_SECRET:event-ingestion-secret-change-in-production}
            authorization-grant-type: client_credentials
        provider:
          keycloak:
            token-uri: http://localhost:8090/realms/alzcare/protocol/openid-connect/token

alzcare:
  services:
    care-team-url: http://localhost:8008
    identity-url: http://localhost:8001
  notifications:
    exchange: alert.notifications
    routing-key: notification.routing.key
  monitoring:
    timezone: Africa/Tunis
    night-start: "22:00"
    night-end: "06:00"
    wandering-min-duration: 120m
    wandering-max-gap: 10m
    wandering-min-zones: 2
    wandering-min-events: 6
    night-motion-min-events: 3
    night-motion-window: 30m
    camera-offline-after: 60m
    max-event-age: 24h
    max-clock-skew: 5m

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

---
# Docker profile
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres-event}:${DB_PORT:5432}/${DB_NAME:postgres-event}
  rabbitmq:
    host: rabbitmq
  security:
    oauth2:
      resourceserver:
        jwt:
          # Keycloak is pinned to its public hostname, so tokens carry the localhost issuer
          issuer-uri: http://localhost:8090/realms/alzcare
          jwk-set-uri: http://keycloak:8080/realms/alzcare/protocol/openid-connect/certs
      client:
        provider:
          keycloak:
            token-uri: http://keycloak:8080/realms/alzcare/protocol/openid-connect/token

alzcare:
  services:
    care-team-url: http://care-team-service:8008
    identity-url: http://identity-service:8001

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:http://eureka-server:8761/eureka/}
  instance:
    prefer-ip-address: true
    hostname: event-ingestion
